<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
      <filter id="paperShadow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.75"/>
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.35"/>
      </filter>
  
    <!-- Primary Brand Orange Gradient (#F97316 Dominant) -->
    <linearGradient id="brandOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="26%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Signature Cream White Accent Gradient (#FFFDF7) -->
    <linearGradient id="creamAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFDF7"/>
    </linearGradient>
  </defs>

  
    <!-- Deep Midnight Slate/Navy Background -->
    <rect width="1024" height="1024" fill="#0F172A"/>

    <!-- Ambient Radial Glow -->
    <radialGradient id="meowndrGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3256" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#111B34" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <circle cx="512" cy="512" r="455" fill="url(#meowndrGlow)"/>

    <!-- Subtle Geometric Framing Guide Ring -->
    <circle cx="512" cy="512" r="418" fill="none" stroke="#1E2E4E" stroke-width="2.5" opacity="0.6"/>
  

  <!-- Master M Lettermark Group with Integrated Feline Ears -->
  <g filter="url(#paperShadow)" id="meowndr-lettermark">
    <!-- Base Uppercase M Silhouette with Feline Ear Peaks -->
    <path id="m-base-silhouette" d="M 238 740 L 230 450 C 228 390, 260 300, 345 235 L 512 515 L 679 235 C 764 300, 796 390, 794 450 L 786 740 L 678 740 L 646 480 L 512 660 L 378 480 L 346 740 Z" fill="url(#brandOrange)"/>

    <!-- Subtle Folded Papercraft Depth Facet (Burnt Orange Tone #EA580C / #9A3412) -->
    <path id="m-depth-facet" d="M 512 515 L 679 235 C 764 300, 796 390, 794 450 L 786 740 L 678 740 L 646 480 L 512 660 Z" fill="#9A3412" opacity="0.16"/>

    <!-- Signature Cream-White Ear Tip Accent on Left Ear Only (#FFFDF7) -->
    <path id="m-signature-white-ear" d="M 308 300 C 322 268, 336 248, 345 235 L 372 280 L 342 292 Z" fill="url(#creamAccent)"/>
  </g>
</svg>
